# macOS endpoint end-to-end test on disposable GitHub-hosted macOS runners (throwaway users, test PKI, mock gateway).
name: poc-macos-e2e
on:
  workflow_dispatch:
  push:
    branches: [poc-macos-test]
permissions:
  contents: read
jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: End-to-end install / test / tamper / uninstall
        run: OUT="$PWD/e2e-out" bash poc/ci/macos-e2e.sh
      - name: Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.os }}
          path: e2e-out
          retention-days: 7
