; AGY managed workstation - xrdp listener (installed by agy-xrdp-setup; do not edit on the VM)
; Reachable only through IAP TCP forwarding (firewall agy-allow-iap-rdp, no public IP).
[Globals]
ini_version=1
fork=true
port=3389
use_vsock=false
tcp_nodelay=true
tcp_keepalive=true
; TLS only (no RDP standard security), high crypt level, TLS 1.2+
security_layer=tls
crypt_level=high
certificate=
key_file=
ssl_protocols=TLSv1.2, TLSv1.3
autorun=
allow_channels=true
allow_multimon=true
bitmap_cache=true
bitmap_compression=true
bulk_compression=true
max_bpp=32
new_cursors=true
use_fastpath=both
require_credentials=false
ls_title=AGY managed workstation - authorised users only

[Logging]
LogFile=xrdp.log
LogLevel=INFO
EnableSyslog=false

[Channels]
; DLP: no drive / printer / smart-card redirection (rdpdr), no RemoteApp, no video redirection
rdpdr=false
rdpsnd=true
drdynvc=true
cliprdr=@CLIPRDR@
rail=false
xrdpvr=false
tcutils=false

; Xorg (xorgxrdp) sessions only - no VNC back-end
[Xorg]
name=Xorg
lib=libxup.so
username=ask
password=ask
ip=127.0.0.1
port=-1
code=20
