# AGY developer workstation kernel settings
# debuggers may attach to their own child processes only (gdb/lldb/dotnet-dump of own launches still work)
kernel.yama.ptrace_scope = 1
# perf for user-space profiling of own processes; no kernel tracing without CAP_PERFMON (JIT)
kernel.perf_event_paranoid = 2
# ports below 1024 stay privileged (dev servers use 5000-5010 / 7000-7010 / 8080)
net.ipv4.ip_unprivileged_port_start = 1024
